<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jago</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #FAF3E8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            overflow: hidden;
        }

        .logo-container {
            text-align: center;
            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0;
        }

        .logo {
            font-size: 80px;
            font-weight: 600;
            color: #FF9F1C;
            letter-spacing: -2px;
            position: relative;
            display: inline-block;
            animation: gentlePulse 2.5s ease-in-out infinite alternate;
        }

        .footer-text {
            position: fixed;
            bottom: 40px;
            text-align: center;
            max-width: 340px;
            animation: fadeIn 2s ease-out 0.8s forwards;
            opacity: 0;
        }

        .footer-text p {
            font-size: 13px;
            color: #8B7D6B;
            line-height: 1.6;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes gentlePulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 0 transparent);
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 4px 12px rgba(255, 159, 28, 0.25));
            }
        }

        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #FF9F1C;
            border-radius: 50%;
            opacity: 0;
            animation: sparkle 4s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 0.4;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="sparkle" style="top: 20%; left: 15%; animation-delay: 0s;"></div>
    <div class="sparkle" style="top: 30%; right: 20%; animation-delay: 1s;"></div>
    <div class="sparkle" style="top: 60%; left: 25%; animation-delay: 2s;"></div>
    <div class="sparkle" style="top: 70%; right: 15%; animation-delay: 3s;"></div>

    <div class="logo-container">
        <div class="logo">Jago</div>
    </div>

    <div class="footer-text">
        <p>PT Bank Jago Tbk berizin dan diawasi oleh Otoritas Jasa Keuangan (OJK) dan Bank Indonesia, serta merupakan peserta penjaminan LPS.</p>
    </div>

    <!-- ✅ Pindah ke loginjago.html setelah 2 detik -->
    <script>
        setTimeout(function() {
            window.location.href = 'loginjago.html';
        }, 2000);
    </script>
</body>
</html>
